<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        #loading {
            position: absolute;
            left: 12px;
            top: 8px;
            padding: 6px 10px;
            background: rgba(0,0,0,.6);
            color: #fff;
            font-family: system-ui, sans-serif;
            border-radius: 8px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!--Etiqueta antes de visulizar los modelos-->
    <div id="loading">Cargando modelos STL...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const motorgrafico = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        let escena;
        let soporteRoot, baseRoot, ejeRoot, antebrazoRoot, brazoRoot, munecaRoot, baseGarraRoot, engranaje1Root, engranaje2Root, barra1Root, barra2Root, pinza2Root, pinza1Root;
        let camara;
        let puntoInicialCamara = BABYLON.Vector3.Zero();

        // Pivotes para pider realizar los movimientos
        let ejePivot, antebrazoPivot, brazoPivot, munecaPivot, baseGarraPivot, engranaje1Pivot, engranaje2Pivot, barra1Pivot, barra2Pivot, pinza1Pivot;

        function Crearescena() {
            escena = new BABYLON.Scene(motorgrafico);
            escena.clearColor = new BABYLON.Color3(1, 1, 1);

            escena.createDefaultEnvironment({
                createGround: true,
                groundSize: 400,
                enableGroundShadow: true
            });

            //vista a 90 grados
            camara = new BABYLON.ArcRotateCamera("cam",
                Math.PI,
                Math.PI / 2.6,
                700,
                BABYLON.Vector3.Zero(), escena);
            camara.attachControl(canvas, true);
            camara.wheelPrecision = 0.1;
            camara.pinchPrecision = 1;

            //luces
            new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), escena);
            const directorio = new BABYLON.DirectionalLight("directorio", new BABYLON.Vector3(-1, -2, -1), escena);
            directorio.position = new BABYLON.Vector3(40, 80, 40);

            const generadorsombras = new BABYLON.ShadowGenerator(2048, directorio);
            generadorsombras.useExponentialShadowMap = true;

            //ajustar la camara
            function ajustarCamaraAlModelo() {
                const malla = escena.malla.filter(m => m && m.name !== "__root__");
                if (malla.length === 0) return;

                let min = new BABYLON.Vector3(Number.MAX_VALUE, Number.MAX_VALUE, Number.MAX_VALUE);
                let max = new BABYLON.Vector3(-Number.MAX_VALUE, -Number.MAX_VALUE, -Number.MAX_VALUE);

                malla.forEach(m => {
                    const bb = m.getBoundingInfo().boundingBox;
                    min = BABYLON.Vector3.Minimize(min, bb.minimumWorld);
                    max = BABYLON.Vector3.Maximize(max, bb.maximumWorld);
                });

                const centro = min.add(max).scale(0.5);
                const extension = max.subtract(min);
                const maxextension = Math.max(extension.x, extension.y, extension.z);

                camara.setTarget(centro);
                camara.radius = maxextension * 2;
                puntoInicialCamara = centro.clone();
            }

            //se carga el soporte del brazo robotico
            BABYLON.SceneLoader.ImportMesh("", "", "Soporte.stl", escena, (malla) => {
                soporteRoot = new BABYLON.TransformNode("soporteRoot", escena);
                malla.forEach(m => m.parent = soporteRoot);
                soporteRoot.scaling = new BABYLON.Vector3(1, 1, 1);

                const materialSoporte = new BABYLON.StandardMaterial("materialSoporte", escena);
                materialSoporte.diffuseColor = new BABYLON.Color3(0, 0, 1);
                materialSoporte.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                malla.forEach(m => m.material = materialSoporte);

                const bbSoporte = soporteRoot.getHierarchyBoundingVectors(true);
                const soporteHeight = bbSoporte.max.y - bbSoporte.min.y;
                soporteRoot.position.y -= bbSoporte.min.y;
                soporteRoot.rotation.y = 90 * Math.PI / 180;

                //se carga la base
                BABYLON.SceneLoader.ImportMesh("", "", "Base.stl", escena, (malla) => {
                    baseRoot = new BABYLON.TransformNode("baseRoot", escena);
                    malla.forEach(m => m.parent = baseRoot);
                    baseRoot.scaling = new BABYLON.Vector3(1, 1, 1);

                    const materialBase = new BABYLON.StandardMaterial("materialBase", escena);
                    materialBase.diffuseColor = new BABYLON.Color3(1, 1, 1);
                    materialBase.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                    malla.forEach(m => m.material = materialBase);

                    const bbBase = baseRoot.getHierarchyBoundingVectors(true);
                    const baseHeight = bbBase.max.y - bbBase.min.y;
                    baseRoot.position.y -= bbBase.min.y;
                    baseRoot.rotation.y = 90 * Math.PI / 180;

                    //se carga el eje central
                    BABYLON.SceneLoader.ImportMesh("", "", "EjeCentral.stl", escena, (malla) => {
                        ejePivot = new BABYLON.TransformNode("ejePivot", escena);
                        ejeRoot = new BABYLON.TransformNode("ejeRoot", escena);
                        ejeRoot.parent = ejePivot;
                        malla.forEach(m => m.parent = ejeRoot);
                        ejeRoot.scaling = new BABYLON.Vector3(1, 1, 1);

                        const materialEje = new BABYLON.StandardMaterial("materialEje", escena);
                        materialEje.diffuseColor = new BABYLON.Color3(0, 0, 1);
                        materialEje.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                        malla.forEach(m => m.material = materialEje);

                        const posicionarEjeCentral = () => {
                            if (baseRoot && ejeRoot) {
                                const bbEje = ejeRoot.getHierarchyBoundingVectors(true);
                                const ejeMin = bbEje.min;
                                const ejeMax = bbEje.max;

                                const centroEje = new BABYLON.Vector3(
                                    (ejeMin.x + ejeMax.x) / 2,
                                    (ejeMin.y + ejeMax.y) / 2,
                                    (ejeMin.z + ejeMax.z) / 2
                                );

                                ejeRoot.position.y += (baseRoot.getHierarchyBoundingVectors(true).max.y - ejeMin.y);
                                ejeRoot.rotation.y = 90 * Math.PI / 180;
                                ejePivot.setPivotPoint(centroEje);
                            }
                        };
                        posicionarEjeCentral()
                        setTimeout(posicionarEjeCentral, 200);

                        //se carga el antebrazo
                        BABYLON.SceneLoader.ImportMesh("", "", "Antebrazo.stl", escena, (malla) => {
                            antebrazoPivot = new BABYLON.TransformNode("antebrazoPivot", escena);
                            antebrazoPivot.parent = ejePivot;

                            antebrazoRoot = new BABYLON.TransformNode("antebrazoRoot", escena);
                            antebrazoRoot.parent = antebrazoPivot;
                            malla.forEach(m => m.parent = antebrazoRoot);
                            antebrazoRoot.scaling = new BABYLON.Vector3(1, 1, 1);

                            const materialAntebrazo = new BABYLON.StandardMaterial("materialAntebrazo", escena);
                            materialAntebrazo.diffuseColor = new BABYLON.Color3(0, 0, 1);
                            materialAntebrazo.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                            malla.forEach(m => m.material = materialAntebrazo);

                            const posicionarAntebrazo = () => {
                                if (ejeRoot) {
                                    const bbEjeWorld = ejeRoot.getHierarchyBoundingVectors(true);
                                    const ejeMaxYWorld = bbEjeWorld.max.y;

                                    const bbAntebrazo = antebrazoRoot.getHierarchyBoundingVectors(true);
                                    const antebrazoMinX = bbAntebrazo.min.x;
                                    const antebrazoMaxX = bbAntebrazo.max.x;
                                    const antebrazoMinY = bbAntebrazo.min.y;
                                    const antebrazoMinZ = bbAntebrazo.min.z;

                                    const pivoteMitadInferior = new BABYLON.Vector3(
                                        (antebrazoMinX + antebrazoMaxX + 11) / 2,
                                        antebrazoMinY + 20,
                                        antebrazoMinZ
                                    );

                                    antebrazoRoot.position.y += (ejeMaxYWorld - antebrazoMinY) - 45;
                                    antebrazoRoot.rotation.y = 90 * Math.PI / 180;
                                    antebrazoPivot.setPivotPoint(pivoteMitadInferior);
                                    antebrazoPivot.rotation.x = 0;
                                }
                            };

                            posicionarAntebrazo();
                            setTimeout(posicionarAntebrazo, 200);

                            //se carga el brazo
                            BABYLON.SceneLoader.ImportMesh("", "", "Brazo.stl", escena, (malla) => {
                                brazoPivot = new BABYLON.TransformNode("brazoPivot", escena);
                                brazoPivot.parent = antebrazoPivot;

                                brazoRoot = new BABYLON.TransformNode("brazoRoot", escena);
                                brazoRoot.parent = brazoPivot;
                                malla.forEach(m => m.parent = brazoRoot);
                                brazoRoot.scaling = new BABYLON.Vector3(1, 1, 1);

                                const materialBrazo = new BABYLON.StandardMaterial("materialBrazo", escena);
                                materialBrazo.diffuseColor = new BABYLON.Color3(1, 1, 1);
                                materialBrazo.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                malla.forEach(m => m.material = materialBrazo);

                                const posicionarBrazo = () => {
                                    if (antebrazoRoot) {
                                        const bbAntebrazoWorld = antebrazoRoot.getHierarchyBoundingVectors(true);
                                        const antebrazoMaxYWorld = bbAntebrazoWorld.max.y;

                                        const bbBrazo = brazoRoot.getHierarchyBoundingVectors(true);
                                        const brazoMinX = bbBrazo.min.x;
                                        const brazoMaxX = bbBrazo.max.x;
                                        const brazoMinY = bbBrazo.min.y;
                                        const brazoMinZ = bbBrazo.min.z;

                                        const pivoteMitadInferior = new BABYLON.Vector3(
                                            (brazoMinX + brazoMaxX + 4.5) / 2,
                                            brazoMinY + 22,
                                            brazoMinZ
                                        );

                                        brazoRoot.position.y += (antebrazoMaxYWorld - brazoMinY) - 43;
                                        brazoRoot.rotation.y = 90 * Math.PI / 180;
                                        brazoPivot.setPivotPoint(pivoteMitadInferior);
                                        brazoPivot.rotation.x = 0;
                                    }
                                };
                                posicionarBrazo();
                                setTimeout(posicionarBrazo, 200);

                                //se carga la muñeca
                                BABYLON.SceneLoader.ImportMesh("", "", "Muneca.stl", escena, (malla) => {
                                    munecaPivot = new BABYLON.TransformNode("munecaPivot", escena);
                                    munecaPivot.parent = brazoPivot;

                                    munecaRoot = new BABYLON.TransformNode("munecaRoot", escena);
                                    munecaRoot.parent = munecaPivot;

                                    malla.forEach(m => m.parent = munecaRoot);
                                    munecaRoot.scaling = new BABYLON.Vector3(1, 1, 1);

                                    const materialMuneca = new BABYLON.StandardMaterial("materialMuneca", escena);
                                    materialMuneca.diffuseColor = new BABYLON.Color3(1, 1, 1);
                                    materialMuneca.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                    malla.forEach(m => m.material = materialMuneca);

                                    const posicionarMuneca = () => {
                                        if (brazoRoot) {
                                            const bbBrazoWorld = brazoRoot.getHierarchyBoundingVectors(true);
                                            const brazoMaxYWorld = bbBrazoWorld.max.y;

                                            const bbMuneca = munecaRoot.getHierarchyBoundingVectors(true);
                                            const munecaMin = bbMuneca.min;
                                            const munecaMax = bbMuneca.max;
                                            const centroMuneca = new BABYLON.Vector3(
                                                (munecaMin.x + munecaMax.x) / 2,
                                                (munecaMin.y + munecaMax.y) / 2,
                                                (munecaMin.z + munecaMax.z) / 2
                                            );

                                            munecaRoot.position.y += (brazoMaxYWorld - munecaMin.y);
                                            munecaRoot.rotation.y = 90 * Math.PI / 180;
                                            munecaPivot.setPivotPoint(centroMuneca);
                                        }
                                    };

                                    posicionarMuneca();
                                    setTimeout(posicionarMuneca, 200);

                                    //se carga la base de la garra
                                    BABYLON.SceneLoader.ImportMesh("", "", "Basedelagarra.stl", escena, (malla) => {
                                        baseGarraPivot = new BABYLON.TransformNode("baseGarraPivot", escena);
                                        baseGarraPivot.parent = munecaPivot;

                                        baseGarraRoot = new BABYLON.TransformNode("baseGarraRoot", escena);
                                        baseGarraRoot.parent = baseGarraPivot;
                                        malla.forEach(m => m.parent = baseGarraRoot);
                                        baseGarraRoot.scaling = new BABYLON.Vector3(1, 1, 1);

                                        const materialBaseGarra = new BABYLON.StandardMaterial("materialBaseGarra", escena);
                                        materialBaseGarra.diffuseColor = new BABYLON.Color3(0, 0, 1);
                                        materialBaseGarra.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                        malla.forEach(m => m.material = materialBaseGarra);

                                        const posicionarBaseGarra = () => {
                                            if (munecaRoot) {
                                                const bbMunecaWorld = munecaRoot.getHierarchyBoundingVectors(true);
                                                const munecaMaxYWorld = bbMunecaWorld.max.y;

                                                const bbGarra = baseGarraRoot.getHierarchyBoundingVectors(true);
                                                const garraMinX = bbGarra.min.x;
                                                const garraMaxX = bbGarra.max.x;
                                                const garraMinY = bbGarra.min.y;
                                                const garraMinZ = bbGarra.min.z;

                                                const pivoteMitadInferior = new BABYLON.Vector3(
                                                    (garraMinX + garraMaxX + 4) / 2,
                                                    garraMinY + 18,
                                                    garraMinZ
                                                );

                                                baseGarraRoot.position.y += (munecaMaxYWorld - garraMinY) - 37;
                                                baseGarraRoot.rotation.y = 90 * Math.PI / 180;
                                                baseGarraPivot.setPivotPoint(pivoteMitadInferior);
                                                baseGarraPivot.rotation.x = 0;
                                            }
                                        };

                                        posicionarBaseGarra();
                                        setTimeout(posicionarBaseGarra, 200);

                                        //se carga el engranaje 1
                                        BABYLON.SceneLoader.ImportMesh("", "", "Engranaje1.stl", escena, (malla) => {
                                            engranaje1Pivot = new BABYLON.TransformNode("engranaje1Pivot", escena);
                                            engranaje1Pivot.parent = baseGarraPivot;


                                            engranaje1Root = new BABYLON.TransformNode("engranaje1Root", escena);
                                            engranaje1Root.parent = engranaje1Pivot;
                                            malla.forEach(m => m.parent = engranaje1Root);
                                            engranaje1Root.scaling = new BABYLON.Vector3(1, 1, 1);

                                            const materialEngranaje1 = new BABYLON.StandardMaterial("materialEngranaje1", escena);
                                            materialEngranaje1.diffuseColor = new BABYLON.Color3(0, 0, 1);
                                            materialEngranaje1.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                            malla.forEach(m => m.material = materialEngranaje1);

                                            const posicionarEngranaje1 = () => {
                                                if (baseGarraRoot) {
                                                    const bbGarraWorld = baseGarraRoot.getHierarchyBoundingVectors(true);
                                                    const garraMaxYWorld = bbGarraWorld.max.y;

                                                    const bbEngranaje = engranaje1Root.getHierarchyBoundingVectors(true);
                                                    const engranajeMinX = bbEngranaje.min.x;
                                                    const engranajeMaxX = bbEngranaje.max.x;
                                                    const engranajeMinY = bbEngranaje.min.y;
                                                    const engranajeMinZ = bbEngranaje.min.z;

                                                    const centroEngranaje = new BABYLON.Vector3(
                                                        (engranajeMinX + engranajeMaxX + 15) / 2,
                                                        engranajeMinY + 10,
                                                        engranajeMinZ + 12
                                                    );

                                                    engranaje1Root.position.y += (garraMaxYWorld - engranajeMinY) - 35;
                                                    engranaje1Root.rotation.y = 90 * Math.PI / 180;
                                                    engranaje1Pivot.setPivotPoint(centroEngranaje);

                                                    engranaje1Root.rotation.x = 0;

                                                }
                                            };
                                            posicionarEngranaje1();
                                            setTimeout(posicionarEngranaje1, 200);

                                            //se carga el engranaje 2
                                            BABYLON.SceneLoader.ImportMesh("", "", "Engranaje2.stl", escena, (malla) => {
                                                engranaje2Pivot = new BABYLON.TransformNode("engranaje2Pivot", escena);
                                                engranaje2Pivot.parent = baseGarraPivot;

                                                engranaje2Root = new BABYLON.TransformNode("engranaje2Root", escena);
                                                engranaje2Root.parent = engranaje2Pivot;
                                                malla.forEach(m => m.parent = engranaje2Root);
                                                engranaje2Root.scaling = new BABYLON.Vector3(1, 1, 1);

                                                const materialEngranaje2 = new BABYLON.StandardMaterial("materialEngranaje2", escena);
                                                materialEngranaje2.diffuseColor = new BABYLON.Color3(0, 0, 1);
                                                materialEngranaje2.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                                malla.forEach(m => m.material = materialEngranaje2);

                                                const posicionarEngranaje2 = () => {
                                                    if (engranaje1Root) {
                                                        const bbEngranaje1World = engranaje1Root.getHierarchyBoundingVectors(true);
                                                        const engranaje1MaxYWorld = bbEngranaje1World.max.y;

                                                        const bbEngranaje2 = engranaje2Root.getHierarchyBoundingVectors(true);
                                                        const engranaje2MinX = bbEngranaje2.min.x;
                                                        const engranaje2MaxX = bbEngranaje2.max.x;
                                                        const engranaje2MinY = bbEngranaje2.min.y;
                                                        const engranaje2MinZ = bbEngranaje2.min.z;

                                                        const centroEngranaje2 = new BABYLON.Vector3(
                                                            (engranaje2MinX + engranaje2MaxX + 15) / 2,
                                                            engranaje2MinY + 10,
                                                            engranaje2MinZ + 37
                                                        );

                                                        engranaje2Root.position.y += (engranaje1MaxYWorld - engranaje2MinY) - 27;
                                                        engranaje2Root.rotation.y = 90 * Math.PI / 180;
                                                        engranaje2Pivot.setPivotPoint(centroEngranaje2);


                                                    }
                                                };

                                                posicionarEngranaje2();
                                                setTimeout(posicionarEngranaje2, 200);

                                                //se cargo barra 1
                                                BABYLON.SceneLoader.ImportMesh("", "", "Barra1.stl", escena, (malla) => {
                                                    barra1Pivot = new BABYLON.TransformNode("barra1Pivot", escena);
                                                    barra1Pivot.parent = baseGarraPivot;

                                                    barra1Root = new BABYLON.TransformNode("barra1Root", escena);
                                                    barra1Root.parent = barra1Pivot;
                                                    malla.forEach(m => m.parent = barra1Root);
                                                    barra1Root.scaling = new BABYLON.Vector3(1, 1, 1);

                                                    const materialBarra1 = new BABYLON.StandardMaterial("materialBarra1", escena);
                                                    materialBarra1.diffuseColor = new BABYLON.Color3(0, 0, 1);
                                                    materialBarra1.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                                    malla.forEach(m => m.material = materialBarra1);

                                                    const posicionarBarra1 = () => {
                                                        if (engranaje2Root) {
                                                            const bbEngranaje1 = engranaje2Root.getHierarchyBoundingVectors(true);
                                                            const engranaje1MaxY = bbEngranaje1.max.y;

                                                            const bbBarra = barra1Root.getHierarchyBoundingVectors(true);
                                                            const barra1MinX = bbBarra.min.x;
                                                            const barra1MaxX = bbBarra.max.x;
                                                            const barra1MinY = bbBarra.min.y;
                                                            const barra1MinZ = bbBarra.min.z;

                                                            const pivotPoint = new BABYLON.Vector3(
                                                                (barra1MinX + barra1MaxX + 8) / 2,
                                                                barra1MinY + 5,
                                                                barra1MinZ + 35
                                                            );

                                                            barra1Root.position.y += (engranaje1MaxY - barra1MinY) - 3;
                                                            barra1Root.rotation.y = 90 * Math.PI / 180;

                                                            barra1Pivot.setPivotPoint(pivotPoint);
                                                            barra1Root.rotation.x = 0;
                                                        }
                                                    };

                                                    posicionarBarra1();
                                                    setTimeout(posicionarBarra1, 200);

                                                    //se carga barra 2
                                                    BABYLON.SceneLoader.ImportMesh("", "", "Barra2.stl", escena, (malla) => {
                                                        barra2Pivot = new BABYLON.TransformNode("barra2Pivot", escena);
                                                        barra2Pivot.parent = baseGarraPivot;

                                                        barra2Root = new BABYLON.TransformNode("barra2Root", escena);
                                                        barra2Root.parent = barra2Pivot;
                                                        malla.forEach(m => m.parent = barra2Root);
                                                        barra2Root.scaling = new BABYLON.Vector3(1, 1, 1);

                                                        const materialBarra2 = new BABYLON.StandardMaterial("materialBarra2", escena);
                                                        materialBarra2.diffuseColor = new BABYLON.Color3(0, 0, 1);
                                                        materialBarra2.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                                        malla.forEach(m => m.material = materialBarra2);

                                                        const posicionarBarra2 = () => {
                                                            if (engranaje2Root) {
                                                                const bbEngranaje2 = engranaje2Root.getHierarchyBoundingVectors(true);
                                                                const engranaje2MaxY = bbEngranaje2.max.y;

                                                                const bbBarra2 = barra2Root.getHierarchyBoundingVectors(true);
                                                                const barraMinX = bbBarra2.min.x;
                                                                const barraMaxX = bbBarra2.max.x;
                                                                const barraMinY = bbBarra2.min.y;
                                                                const barraMinZ = bbBarra2.min.z;

                                                                const pivotPoint = new BABYLON.Vector3(
                                                                    (barraMinX + barraMaxX + 8) / 2,
                                                                    barraMinY + 5,
                                                                    barraMinZ + 6
                                                                );

                                                                barra2Root.position.y += (engranaje2MaxY - barraMinY) - 3;
                                                                barra2Root.rotation.y = 90 * Math.PI / 180;

                                                                barra2Pivot.setPivotPoint(pivotPoint);
                                                                barra2Root.rotation.x = 0;
                                                            }
                                                        };

                                                        posicionarBarra2();
                                                        setTimeout(posicionarBarra2, 200);


                                                        //se carga la pinza 1
                                                        BABYLON.SceneLoader.ImportMesh("", "", "Pinza1.stl", escena, (malla) => {

                                                            pinza1Pivot = new BABYLON.TransformNode("pinza1Pivot", scene);
                                                            pinza1Pivot.parent = engranaje1Pivot;

                                                            pinza1Root = new BABYLON.TransformNode("pinza1Root", escena);
                                                            pinza1Root.parent = pinza1Pivot;
                                                            malla.forEach(m => m.parent = pinza1Root);
                                                            pinza1Root.scaling = new BABYLON.Vector3(1, 1, 1);

                                                            const materialPinza1 = new BABYLON.StandardMaterial("materialPinza1", escena);
                                                            materialPinza1.diffuseColor = new BABYLON.Color3(1, 1, 1);
                                                            materialPinza1.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                                            malla.forEach(m => m.material = materialPinza1);

                                                            const posicionarPinza1 = () => {
                                                                if (engranaje1Root) {
                                                                    const bbEngranaje1 = engranaje1Root.getHierarchyBoundingVectors(true);
                                                                    const engranaje1MaxY = bbEngranaje1.max.y;

                                                                    const bbPinza = pinza1Root.getHierarchyBoundingVectors(true);
                                                                    const pinzaMinX = bbPinza.min.x;
                                                                    const pinzaMaxX = bbPinza.max.x;
                                                                    const pinzaMinY = bbPinza.min.y;
                                                                    const pinzaMinz = bbPinza.min.z;

                                                                    const centropivot = new BABYLON.Vector3(
                                                                        (pinzaMinX + pinzaMaxX + 8) / 2,
                                                                        pinzaMinY + 5,
                                                                        pinzaMinz + 10
                                                                    );

                                                                    pinza1Root.position.y += (engranaje1MaxY - pinzaMinY) - 12;
                                                                    pinza1Root.rotation.y = 90 * Math.PI / 180;
                                                                    pinza1Pivot.setPivotPoint(centropivot);
                                                                }
                                                            };

                                                            posicionarPinza1();
                                                            setTimeout(posicionarPinza1, 200);

                                                            //se carga la pinza 2
                                                            BABYLON.SceneLoader.ImportMesh("", "", "Pinza2.stl", escena, (malla) => {
                                                                pinza2Pivot = new BABYLON.TransformNode("pinza2Pivot", escena);
                                                                pinza2Pivot.parent = engranaje2Pivot;
                                                                pinza2Root = new BABYLON.TransformNode("pinza2Root", escena);
                                                                pinza2Root.parent = pinza2Pivot;
                                                                malla.forEach(m => m.parent = pinza2Root);
                                                                pinza2Root.scaling = new BABYLON.Vector3(1, 1, 1);

                                                                const materialPinza2 = new BABYLON.StandardMaterial("materialPinza2", escena);
                                                                materialPinza2.diffuseColor = new BABYLON.Color3(1, 1, 1);
                                                                materialPinza2.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                                                                malla.forEach(m => m.material = materialPinza2);

                                                                const posicionarPinza2 = () => {
                                                                    if (engranaje2Root) {
                                                                        const bbEngranaje2 = engranaje2Root.getHierarchyBoundingVectors(true);
                                                                        const engranaje2MaxY = bbEngranaje2.max.y;

                                                                        const bbPinza2 = pinza2Root.getHierarchyBoundingVectors(true);
                                                                        const pinza2MinX = bbPinza2.min.x;
                                                                        const pinza2MaxX = bbPinza2.max.x;
                                                                        const pinza2MinY = bbPinza2.min.y;
                                                                        const pinza2Minz = bbPinza2.min.z;

                                                                        const centropivot2 = new BABYLON.Vector3(
                                                                            (pinza2MinX + pinza2MaxX + 8) / 2,
                                                                            pinza2MinY + 5,
                                                                            pinza2Minz + 8
                                                                        );

                                                                        pinza2Root.position.y += (engranaje2MaxY - pinza2MinY) - 12;
                                                                        pinza2Root.rotation.y = 90 * Math.PI / 180;

                                                                        pinza2Pivot.setPivotPoint(centropivot2);
                                                                    }
                                                                };

                                                                posicionarPinza2();
                                                                setTimeout(posicionarPinza2, 200);

                                                                setTimeout(ajustarCamaraAlModelo, 600);
                                                                document.getElementById("loading").style.display = "none";
                                                            });
                                                        });
                                                    });
                                                });
                                            });
                                        });
                                    });
                                });
                            });
                        });
                    });
                });
            });
            return escena;
        }

        Crearescena();

        motorgrafico.runRenderLoop(() => {
            if (escena) escena.render();
        });

        window.addEventListener("resize", () => motorgrafico.resize());

        //mandar datos a la clase del control de brazo
        window.setEjeCentralRotacionY = function (deg) {
            if (!ejePivot) return;
            ejePivot.rotation.y = (90 - deg) * Math.PI / 180.0;
        };

        window.setAntebrazoRotacionX = function (deg) {
            if (!antebrazoPivot) return;
            antebrazoPivot.rotation.z = (90 - deg) * Math.PI / 180.0;
        };

        window.setBrazoRotacionX = function (deg) {
            if (!brazoPivot) return;
            brazoPivot.rotation.z = -(90 - deg) * Math.PI / 180.0;
        };

        window.setMunecaRotacionY = function (deg) {
            if (!munecaPivot) return;
            munecaPivot.rotation.y = (90 - deg) * Math.PI / 180.0;
        };

        window.setBaseGarraRotacionX = function (deg) {
            if (!baseGarraPivot) return;
            baseGarraPivot.rotation.z = (90 - deg) * Math.PI / 180.0;
        };

        window.setEngranaje1Rotacion = function (deg) {
            if (!engranaje1Pivot) return;
            const rotacionEngranaje1 = (-90 + deg) * Math.PI / 300.0;
            const rotacionbarra1 = (-90 + deg) * Math.PI / 300.0;
            const rotacionpinza1 = (-90 + deg) * Math.PI / 400.0;

            engranaje1Pivot.rotation.x = rotacionEngranaje1;

            if (barra2Pivot) {
                barra2Pivot.rotation.x = rotacionbarra1;
            }
            if (pinza1Pivot) {
                pinza1Pivot.rotation.x = -rotacionpinza1;
            }
            if (engranaje2Pivot) {
                engranaje2Pivot.rotation.x = -rotacionEngranaje1;
            }
            if (barra1Pivot) {
                barra1Pivot.rotation.x = -rotacionbarra1;
            }
            if (pinza2Pivot) {
                pinza2Pivot.rotation.x = rotacionpinza1;
            }
        };

        window.ajustarvista = function () {
            if (!camara) return;

            camara.alpha = Math.PI;
            camara.beta = Math.PI / 2;
            camara.radius = 980;

            if (puntoInicialCamara) {
                camara.setTarget(puntoInicialCamara);
            }
        };

    </script>
</body>
